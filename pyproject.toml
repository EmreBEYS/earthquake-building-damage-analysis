[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earthquake-building-damage-analysis"
version = "0.1.0"
description = "Data-driven analysis of post-earthquake building damage levels."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "PyMuPDF>=1.24,<2",
  "plotly>=5.24,<7",
  "streamlit>=1.39,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.13,<0.14",
  "jupyterlab>=4.2",
]

analysis = [
  "geopandas>=1.0,<2",
  "httpx>=0.27,<1",
  "imbalanced-learn>=0.12,<1",
  "joblib>=1.4,<2",
  "pyarrow>=18,<27",
  "pyogrio>=0.10,<1",
  "python-dotenv>=1.0,<2",
  "scipy>=1.14,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

